<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyrus ONE Remote</title><style>
*{box-sizing:border-box}body{margin:0;background:#101112;color:#eee;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:460px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;letter-spacing:4px;font-weight:500}p,small{color:#aaa}button{font:inherit;color:#eee;background:#242628;border:1px solid #454749;border-radius:12px;padding:15px;min-height:48px}button:disabled,input:disabled{opacity:.35}button:active{background:#555}#connect{width:100%;background:#ddd;color:#111;font-weight:600}.dial{width:210px;height:210px;margin:28px auto;border:8px solid #383a3c;border-radius:50%;background:radial-gradient(circle,#303234,#171819);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 30px #0008}.dial strong{font-size:58px;font-weight:300}.dial small{letter-spacing:3px}input[type=range]{width:100%;accent-color:#ddd;margin:12px 0 22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.three{grid-template-columns:repeat(3,1fr)}h2{font-size:12px;letter-spacing:2px;color:#aaa;margin-top:28px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#aaa;max-height:220px;overflow:auto}#status{font-size:13px}button.selected{background:#ddd;color:#111}</style></head><body><main><header><h1>CYRUS ONE</h1><small>REMOTE</small></header><p id="status" role="status">Disconnected</p><button id="connect">Connect amplifier</button><div class="dial"><strong id="level">—</strong><small>VOLUME</small></div><input id="slider" aria-label="Volume" type="range" min="0" max="50" value="0" disabled><small>Release slider to send. Initial safety cap: 50.</small><div class="grid three" style="margin-top:16px"><button data-control id="minus" disabled>−</button><button data-control id="mute" disabled>Mute</button><button data-control id="plus" disabled>+</button></div><button data-control id="unmute" style="width:100%;margin-top:10px" disabled>Unmute</button><h2>INPUT SOURCE</h2><div class="grid"><button data-control data-input="1" disabled>Bluetooth</button><button data-control data-input="2" disabled>Phono</button><button data-control data-input="3" disabled>Source 3</button><button data-control data-input="4" disabled>Source 4</button></div><p><small id="feedback">Input and mute status are not yet independently decoded.</small></p><details><summary>Diagnostic log</summary><pre id="log"></pre></details><p><small>Unofficial personal remote · v0.2</small></p></main><script>
'use strict';const $=id=>document.getElementById(id),SERVICE='bc2f4cc6-aaef-4351-9034-d66268e328f0',CHAR='06d1e5e7-79ad-4a71-8faa-373789f7d93c';let device,characteristic,volume=null,busy=false,connected=false;const log=s=>{$('log').textContent=(new Date().toLocaleTimeString()+' '+s+'\n'+$('log').textContent).slice(0,12000)};function controls(){document.querySelectorAll('[data-control]').forEach(b=>b.disabled=!connected||busy);$('slider').disabled=!connected||busy;$('minus').disabled=!connected||busy||volume===null||volume<=0;$('plus').disabled=!connected||busy||volume===null||volume>=50}function showVolume(v){volume=v;$('level').textContent=v;$('slider').value=Math.min(v,50);controls()}function disconnected(){connected=false;characteristic=null;volume=null;$('level').textContent='—';$('status').textContent='Disconnected';$('connect').textContent='Connect amplifier';controls()}function notification(e){const a=new Uint8Array(e.target.value.buffer,e.target.value.byteOffset,e.target.value.byteLength);const s=Array.from(a,b=>String.fromCharCode(b)).join('');log('RX '+s);if(/^@\d{2}%$/.test(s))showVolume(Number(s.slice(1,3)));else $('feedback').textContent='Received '+s+' (input/mute status ambiguous)'}
$('connect').onclick=async()=>{if(connected){device.gatt.disconnect();disconnected();return}if(!navigator.bluetooth){$('status').textContent='Web Bluetooth unavailable. Open this HTTPS page in Bluefy.';return}$('connect').disabled=true;try{$('status').textContent='Scanning all BLE devices… Select ONE-057 only.';device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SERVICE]});device.addEventListener('gattserverdisconnected',disconnected);const server=await device.gatt.connect();const service=await server.getPrimaryService(SERVICE);characteristic=await service.getCharacteristic(CHAR);characteristic.addEventListener('characteristicvaluechanged',notification);await characteristic.startNotifications();connected=true;$('status').textContent='Connected · '+(device.name||'Cyrus ONE');$('connect').textContent='Disconnect';log('Connected; notifications enabled');$('feedback').textContent='Turn physical volume knob once to synchronize volume.';controls()}catch(e){log('Connection error: '+e.message);if(device&&device.gatt&&device.gatt.connected)device.gatt.disconnect();disconnected();$('status').textContent='Connection failed: '+e.message}finally{$('connect').disabled=false}};
async function send(s){if(!connected||busy||!characteristic)return false;busy=true;controls();try{const bytes=Uint8Array.from(s,c=>c.charCodeAt(0));log('TX '+s);if(typeof characteristic.writeValueWithResponse==='function')await characteristic.writeValueWithResponse(bytes);else await characteristic.writeValue(bytes);log('Write acknowledged');return true}catch(e){log('Write error: '+e.message);$('feedback').textContent='Write failed: '+e.message;return false}finally{busy=false;controls()}}async function setVolume(v){v=Math.max(0,Math.min(50,Math.round(v)));if(await send('@+V2'+String(v).padStart(2,'0')+'%')){$('feedback').textContent='Volume '+v+' requested; physical feedback confirms actual level.';if(volume!==v){volume=null;$('level').textContent='—';controls()}}} $('slider').addEventListener('input',()=>{$('level').textContent=$('slider').value+'*'});$('slider').addEventListener('change',()=>setVolume(Number($('slider').value)));$('minus').onclick=()=>setVolume(volume-1);$('plus').onclick=()=>setVolume(volume+1);$('mute').onclick=()=>send('@+M11%');$('unmute').onclick=()=>send('@+M10%');document.querySelectorAll('[data-input]').forEach(b=>b.onclick=()=>send('@+I1'+b.dataset.input+'%'));controls();</script></body></html>
